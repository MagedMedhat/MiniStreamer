<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Watch</title>
  </head>
  <body
    style="
      font-family: system-ui, sans-serif;
      max-width: 800px;
      margin: 2rem auto;
    "
  >
    <a href="/">← Back</a>
    <h1 id="title"></h1>
    <video id="player" controls width="720"></video>

    <script>
      const id = new URLSearchParams(location.search).get("id");
      (async () => {
        const res = await fetch(`/api/videos/${id}`);
        if (!res.ok) {
          document.getElementById("title").textContent = "Video not found";
          return;
        }
        const v = await res.json();
        document.getElementById("title").textContent = v.title;
        document.getElementById("player").src = `/api/videos/${id}/stream`;
      })();
    </script>
  </body>
</html>
